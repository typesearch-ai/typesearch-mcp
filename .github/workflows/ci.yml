name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # typesearch-js: from npm once it is there; until then, its public repository built next to this one.
      - run: bash .github/scripts/install.sh
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # While package.json asks for typesearch-js by path (before it is on npm), the build takes that folder
      # as a named context; once it asks for the npm version, it is a plain `docker build`.
      - run: bash .github/scripts/install.sh --sdk-only
      - name: docker build
        run: |
          if grep -q '"typesearch-js": "file:' package.json; then
            rm -rf ../typesearch-js/node_modules
            docker build --build-context typesearch-js=../typesearch-js -t typesearch-mcp .
          else
            docker build -t typesearch-mcp .
          fi
      - name: The image starts and answers the MCP handshake
        run: |
          docker run --rm typesearch-mcp --version
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'; sleep 3) \
            | docker run -i --rm typesearch-mcp | grep -q '"name":"typesearch"'

  registry:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions match package.json
        run: |
          test "$(jq -r .version package.json)" = "$(jq -r '.packages[0].version' server.json)"
          test "$(jq -r .mcpName package.json)" = "$(jq -r .name server.json)"
      - name: Valid against the MCP Registry schema
        run: |
          curl -fsSL -o "$RUNNER_TEMP/server.schema.json" "$(jq -r '."$schema"' server.json)"
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft7 -c ajv-formats -s "$RUNNER_TEMP/server.schema.json" -d server.json --strict=false
