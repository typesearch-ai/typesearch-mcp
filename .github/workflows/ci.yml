name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t typesearch-mcp .
      - name: The image starts and answers the MCP handshake
        run: |
          docker run --rm typesearch-mcp --version
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'; sleep 3) \
            | docker run -i --rm typesearch-mcp | grep -q '"name":"typesearch"'

  registry:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions match package.json
        run: |
          test "$(jq -r .version package.json)" = "$(jq -r '.packages[0].version' server.json)"
          test "$(jq -r .mcpName package.json)" = "$(jq -r .name server.json)"
      - name: Valid against the MCP Registry schema
        run: |
          npx -y ajv-cli@5 validate --spec=draft7 -c ajv-formats -s <(curl -fsSL "$(jq -r '."$schema"' server.json)") -d server.json --strict=false
